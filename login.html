<style>
  :root {
    --nacht: #07080d; --paper: #f3ead9; --text: #ece6da; --quiet: rgba(236, 230, 218, 0.62);
    --line: rgba(236, 230, 218, 0.1); --orange: #f75c03; --glut: #ffb35c; --moon: #a9bcff; --hospice: #ff7a6a;
    --land: clamp(260px, 50vh, 500px);
    --serif: "Instrument Serif", Georgia, serif; --sans: Geist, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse 90% 70% at 50% 34%, #141a2b 0%, #0a0c14 52%, var(--nacht) 100%);
    color: var(--text); font-family: var(--sans); overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .sky { position: fixed; inset: 0; width: 100%; height: 100%; fill: #dfe6ff; }
  .moon {
    position: fixed; top: 13vh; left: calc(50% + min(34vw, 470px)); width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #f4f6ff 0%, #d9e0f5 55%, #b9c4e6 100%);
    box-shadow: 0 0 40px 6px rgba(169, 188, 255, 0.28), 0 0 140px 40px rgba(169, 188, 255, 0.10);
  }
  .moon::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 64% 60%, rgba(150, 162, 200, 0.45) 0 9%, transparent 10%),
                radial-gradient(circle at 34% 64%, rgba(150, 162, 200, 0.35) 0 6%, transparent 7%),
                radial-gradient(circle at 56% 30%, rgba(150, 162, 200, 0.3) 0 5%, transparent 6%);
  }
  .land { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: var(--land); }
  .land .hill { fill: #0c101b; }
  .land .stones { fill: #121622; }
  .land .wall { fill: #06070b; }
  .land .edge { fill: none; stroke: rgba(169, 188, 255, 0.16); stroke-width: 1; }
  .land .gate path { stroke: #06070b; stroke-width: 2.2; fill: none; }
  .land .gate .tip { fill: #06070b; stroke: none; }
  .land .ground { fill: #05060a; }
  .fog { position: fixed; left: -10%; right: -10%; bottom: 0; height: clamp(120px, 20vh, 200px); pointer-events: none; }
  .fog i {
    position: absolute; bottom: 0; height: 100%; border-radius: 50%; filter: blur(28px);
    background: radial-gradient(ellipse at center, rgba(169, 188, 255, 0.10), transparent 70%);
    animation: drift 38s ease-in-out infinite alternate;
  }
  .fog i:nth-child(1) { left: 0; width: 60%; }
  .fog i:nth-child(2) { left: 35%; width: 55%; bottom: -30px; animation-duration: 46s; animation-direction: alternate-reverse; }
  .fog i:nth-child(3) { left: 62%; width: 48%; animation-duration: 54s; }
  @keyframes drift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
  @media (prefers-reduced-motion: reduce) { .fog i { animation: none; } }

  main {
    position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; text-align: center; padding: 24px 16px calc(var(--land) * 0.78 + 20px);
  }
  .brand { font-family: Outfit, var(--sans); font-weight: 600; font-size: 15px; letter-spacing: 0.02em; color: var(--quiet); }
  h1 { margin: 10px 0 0; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(40px, 6vw, 56px); line-height: 1.02; color: var(--paper); }
  .access { margin: 12px 0 0; font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--quiet); }
  form { margin: 34px 0 0; }
  button {
    appearance: none; border: 0; cursor: pointer; padding: 14px 26px; border-radius: 12px;
    font: 500 15px var(--sans); color: #fff; background: var(--orange);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 10px 30px rgba(247, 92, 3, 0.32);
    transition: background 0.15s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  button:hover { background: #ff6a14; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--glut); outline-offset: 3px; }
  button[disabled] { opacity: 0.7; cursor: default; }
  .foot { margin: 16px 0 0; max-width: 420px; text-wrap: balance; font-size: 13px; line-height: 1.5; color: var(--quiet); }
  .foot b { display: block; font-weight: 500; color: var(--hospice); }
  .foot b.quiet { color: var(--text); }
</style>
</head>

<main>
  <div class="brand">{{brand}}</div>
  <h1>{{title}}</h1>
  <p class="access">{{loginAccess}}</p>
  <form method="POST" action="/api/auth/signin/{{provider}}">
    <input type="hidden" name="csrfToken" value="">
    <input type="hidden" name="callbackUrl" value="/">
    <button type="submit">{{loginButton}}</button>
  </form>
  <p class="foot"><span class="message"></span>{{access}}</p>
</main>
<script>
  (function () {
    var T = {{loginTexts}};
    var q = new URLSearchParams(location.search);
    var next = q.get('next') || '/';
    if (next.charAt(0) !== '/' || next.charAt(1) === '/') next = '/';
    var form = document.querySelector('form');
    form.callbackUrl.value = next;
    var message = document.querySelector('.message');
    var error = q.get('error');
    if (error) message.outerHTML = '<b>' + (error === 'AccessDenied' ? T.denied : T.failed) + '</b>';
    else if (q.get('signed_out')) message.outerHTML = '<b class="quiet">' + T.signedOut + '</b>';
    var token = fetch('/api/auth/csrf', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) { return d.csrfToken; });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var button = form.querySelector('button');
      var buttonText = button.textContent;
      button.disabled = true; button.textContent = T.wait;
      token.then(function (t) { form.csrfToken.value = t; form.submit(); }, function () {
        button.disabled = false; button.textContent = buttonText;
      });
    });
  })();
</script>
